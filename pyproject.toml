[project]
name = "engsoftware"
version = "0.1.0"
description = "Microservices scaffold: url downloader, html extractor, search indexer and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["common", "api", "downloader", "extractor", "indexer"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["\\.venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["packages/common/src", "services/api/src", "services/downloader/src", "services/extractor/src", "services/indexer/src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:common.*", "error::DeprecationWarning:api.*"]
