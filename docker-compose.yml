name: engsoftware

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonic:
    image: valeriansaliou/sonic:v1.10.2
    environment:
      SONIC_SERVER__LOG_LEVEL: warn
      SONIC_CHANNEL__INET: 0.0.0.0:1491
      SONIC_CHANNEL__AUTH_PASSWORD: SecretPassword
      SONIC_STORE__KV__PATH: /var/lib/sonic/store/kv/
      SONIC_STORE__FST__PATH: /var/lib/sonic/store/fst/
    ports: ["1491:1491"]
    volumes: ["sonic-data:/var/lib/sonic/store"]

  api:
    build: { context: ., args: { SERVICE: api } }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: &env
      REDIS_URL: redis://redis:6379/0
      SONIC_HOST: sonic
      SONIC_PORT: "1491"
      SONIC_PASSWORD: SecretPassword
      RAW_STORAGE_DIR: /app/data/raw
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }

  downloader:
    build: { context: ., args: { SERVICE: downloader } }
    command: celery -A downloader.main:app worker -Q download -l info
    environment: *env
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }

  extractor:
    build: { context: ., args: { SERVICE: extractor } }
    command: celery -A extractor.main:app worker -Q extract -l info
    environment: *env
    volumes: ["raw-data:/app/data/raw"]
    depends_on:
      redis: { condition: service_healthy }

  indexer:
    build: { context: ., args: { SERVICE: indexer } }
    command: celery -A indexer.main:app worker -Q index -l info
    environment: *env
    depends_on:
      redis: { condition: service_healthy }
      sonic: { condition: service_started }

volumes:
  raw-data:
  sonic-data:
