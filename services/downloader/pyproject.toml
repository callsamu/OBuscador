[project]
name = "downloader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["common", "httpx>=0.27", "sqlalchemy>=2.0", "sqlmodel>=0.0.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/downloader"]

[tool.uv.sources]
common = { workspace = true }
