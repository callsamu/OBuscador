[project]
name = "common"
version = "0.1.0"
description = "Shared configuration, contracts and Celery plumbing"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.uv.sources]
common = { workspace = true }
